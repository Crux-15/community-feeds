name: Look at sites with a browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Look at the sites
        run: node discover.js
